    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f7f7f5;
      }

      .initial-app-shell {
        position: fixed;
        inset: 0;
        z-index: 2147482998;
        display: grid;
        grid-template-rows: 52px minmax(0, 1fr);
        background: #f7f7f5;
        pointer-events: none;
        transition:
          opacity 160ms ease,
          visibility 160ms ease;
      }

      .initial-app-topbar {
        border-bottom: 1px solid rgba(31, 35, 40, 0.08);
        background: #ffffff;
      }

      .initial-app-body {
        display: grid;
        grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
        min-height: 0;
      }

      .initial-app-sidebar {
        display: grid;
        align-content: start;
        gap: 10px;
        padding: 14px 12px;
        border-right: 1px solid rgba(31, 35, 40, 0.08);
        background: #fbfbf8;
      }

      .initial-app-main {
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        min-width: 0;
        padding: 24px;
      }

      .initial-app-line {
        height: 12px;
        border-radius: 6px;
        background: #e7e7e2;
      }

      .initial-app-line.is-short {
        width: 42%;
      }

      .initial-app-line.is-medium {
        width: 68%;
      }

      .initial-app-line.is-wide {
        width: min(760px, 82%);
      }

      .initial-app-loader {
        position: fixed;
        inset: 0;
        z-index: 2147482999;
        display: grid;
        place-items: center;
        color: #57606a;
        font:
          13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        pointer-events: none;
        transition:
          opacity 160ms ease,
          visibility 160ms ease;
      }

      .initial-app-loader-inner {
        display: grid;
        justify-items: center;
        gap: 12px;
      }

      .initial-app-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(31, 35, 40, 0.14);
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: initialAppSpin 720ms linear infinite;
      }

      body[data-bootstrap-state="ready"] .initial-app-shell,
      body[data-bootstrap-state="ready"] .initial-app-loader {
        visibility: hidden;
        opacity: 0;
      }

      @keyframes initialAppSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        body,
        .initial-app-shell {
          background: #181818;
        }

        .initial-app-topbar,
        .initial-app-sidebar {
          background: #202020;
          border-color: rgba(255, 255, 255, 0.1);
        }

        .initial-app-line {
          background: #303030;
        }

        .initial-app-loader {
          color: #d6d6d6;
        }

        .initial-app-spinner {
          border-color: rgba(255, 255, 255, 0.16);
          border-top-color: #339cff;
        }
      }

      @media (max-width: 760px) {
        .initial-app-body {
          grid-template-columns: minmax(0, 1fr);
        }

        .initial-app-sidebar {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-app-shell,
        .initial-app-loader {
          transition: none;
        }

        .initial-app-spinner {
          animation: none;
        }
      }
    </style>

          <div class="initial-app-line is-medium"></div>

        </div>
        <div class="initial-app-main">

          <div class="initial-app-line is-short"></div>
        </div>

    </div>

        <span>Loading Agent Teams...</span>
      </div>
    </div>
