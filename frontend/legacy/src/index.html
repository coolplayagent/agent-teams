    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f7f7f5;
        color: #1f2328;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .initial-runtime-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: #f7f7f5;
        pointer-events: none;
        transition:
          opacity 160ms ease,
          visibility 160ms ease;
      }

      .initial-runtime-loader-inner {
        display: grid;
        justify-items: center;
        gap: 14px;
        color: #4b5563;
        font-size: 13px;
        line-height: 1.4;
      }

      .initial-runtime-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(31, 35, 40, 0.14);
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: initialRuntimeSpin 720ms linear infinite;
      }

      .initial-runtime-shell {
        position: fixed;
        inset: 0;
        z-index: 2147482999;
        display: grid;
        grid-template-rows: 52px minmax(0, 1fr);
        background: #f7f7f5;
        pointer-events: none;
      }

      .initial-runtime-topbar {
        border-bottom: 1px solid rgba(31, 35, 40, 0.08);
        background: rgba(255, 255, 255, 0.9);
      }

      .initial-runtime-body {
        display: grid;
        grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      }

      .initial-runtime-sidebar {
        padding: 18px 16px;
        border-right: 1px solid rgba(31, 35, 40, 0.08);
        background: rgba(255, 255, 255, 0.72);
      }

      .initial-runtime-main {
        padding: 22px;
      }

      .initial-runtime-line {
        height: 12px;
        margin-bottom: 12px;
        border-radius: 999px;
        background: linear-gradient(90deg, #eceff3 25%, #f7f8fa 37%, #eceff3 63%);
        background-size: 400% 100%;
        animation: initialRuntimeShimmer 1.2s ease-in-out infinite;
      }

      .initial-runtime-line.is-short {
        width: 42%;
      }

      .initial-runtime-line.is-medium {
        width: 68%;
      }

      .initial-runtime-line.is-wide {
        width: min(720px, 82%);
      }

      body[data-bootstrap-state="ready"] .initial-runtime-loader,
      body[data-bootstrap-state="ready"] .initial-runtime-shell {
        visibility: hidden;
        opacity: 0;
      }

      body[data-projects-ready="false"] #projects-list {
        visibility: hidden;
      }

      @keyframes initialRuntimeSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes initialRuntimeShimmer {
        0% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0 50%;
        }
      }

      @media (prefers-color-scheme: dark) {
        body,
        .initial-runtime-loader,
        .initial-runtime-shell {
          background: #101214;
          color: #f3f4f6;
        }

        .initial-runtime-topbar,
        .initial-runtime-sidebar {
          background: rgba(17, 19, 23, 0.88);
          border-color: rgba(255, 255, 255, 0.08);
        }

        .initial-runtime-loader-inner {
          color: #c9d1d9;
        }

        .initial-runtime-spinner {
          border-color: rgba(255, 255, 255, 0.16);
          border-top-color: #60a5fa;
        }

        .initial-runtime-line {
          background: linear-gradient(90deg, #23272f 25%, #2f3541 37%, #23272f 63%);
          background-size: 400% 100%;
        }
      }

      @media (max-width: 720px) {
        .initial-runtime-body {
          grid-template-columns: 1fr;
        }

        .initial-runtime-sidebar {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-runtime-spinner,
        .initial-runtime-line {
          animation: none;
        }
      }
    </style>

                    data-i18n-aria-label="composer.session_mode"
                  >
                    <button
                      type="button"
                      class="composer-segmented-btn active"
                      id="session-mode-normal-btn"
                      data-i18n="composer.mode_normal"
                    >
                      Normal Mode
                    </button>
                    <button
                      type="button"
                      class="composer-segmented-btn"
                      id="session-mode-orchestration-btn"
                      data-i18n="composer.mode_orchestration"
                    >
                      Orchestrated Mode
                    </button>
                  </div>
                  <div class="composer-normal-route" id="normal-route-controls">
                    <div class="composer-preset-field" id="normal-role-field">
                      <span
                        class="composer-preset-label"
                        id="normal-role-label"
                        data-i18n="composer.role"
                        >Role</span
                      >
                      <select
                        id="normal-role-select"
                        class="composer-preset-select composer-native-select"
                        hidden
                        aria-hidden="true"
                        tabindex="-1"
                      >
                        <option value="" data-i18n="composer.no_roles">
                          No roles
                        </option>
                      </select>
                      <div class="composer-select" id="normal-role-menu">
                        <button
                          type="button"
                          class="composer-select-trigger"
                          id="normal-role-menu-button"
                          aria-haspopup="listbox"
                          aria-expanded="false"
                          aria-controls="normal-role-menu-list"
                          aria-labelledby="normal-role-label normal-role-menu-value"
                        >
                          <span class="composer-select-copy">
                            <span
                              class="composer-select-value"
                              id="normal-role-menu-value"
                              >No roles</span
                            >
                            <span
                              class="composer-select-meta"
                              id="normal-role-menu-meta"
                            ></span>
                          </span>
                          <span
                            class="composer-select-chevron"
                            aria-hidden="true"
                          >
                            <svg viewBox="0 0 16 16" focusable="false">
                              <path d="M4.5 6.5 8 10l3.5-3.5" />
                            </svg>
                          </span>
                        </button>
                        <div
                          class="composer-select-menu"
                          id="normal-role-menu-list"
                          role="listbox"
                          aria-labelledby="normal-role-label"
                          hidden
                        ></div>
                      </div>
                    </div>
                    <div
                      class="composer-preset-field composer-model-field"
                      id="normal-model-field"
                    >
                      <span
                        class="composer-preset-label"
                        id="normal-model-label"
                        data-i18n="composer.model"
                        >Model</span
                      >
                      <select
                        id="normal-model-select"
                        class="composer-preset-select composer-model-select composer-native-select"
                        hidden
                        aria-hidden="true"
                        tabindex="-1"
                      >
                        <option value="" data-i18n="composer.model_role_default">
                          Role default
                        </option>
                      </select>
                      <div class="composer-select composer-model-select-menu" id="normal-model-menu">
                        <button
                          type="button"
                          class="composer-select-trigger"
                          id="normal-model-menu-button"
                          aria-haspopup="listbox"
                          aria-expanded="false"
                          aria-controls="normal-model-menu-list"
                          aria-labelledby="normal-model-label normal-model-menu-value"
                        >
                          <span class="composer-select-copy">
                            <span
                              class="composer-select-value"
                              id="normal-model-menu-value"
                              >Role default</span
                            >
                            <span
                              class="composer-select-meta"
                              id="normal-model-menu-meta"
                            ></span>
                          </span>
                          <span
                            class="composer-select-chevron"
                            aria-hidden="true"
                          >
                            <svg viewBox="0 0 16 16" focusable="false">
                              <path d="M4.5 6.5 8 10l3.5-3.5" />
                            </svg>
                          </span>
                        </button>
                        <div
                          class="composer-select-menu"
                          id="normal-model-menu-list"
                          role="listbox"
                          aria-labelledby="normal-model-label"
                          hidden
                        ></div>
                      </div>
                    </div>
                  </div>
                  <label
                    class="composer-preset-field"
                    id="orchestration-preset-field"
                    hidden
                  >
                    <span
                      class="composer-preset-label"
                      data-i18n="composer.preset"
                      >Preset</span
                    >
                    <select
                      id="orchestration-preset-select"
                      class="composer-preset-select"
                    >
                      <option value="" data-i18n="composer.no_presets">
                        No presets
                      </option>
                    </select>
                  </label>
                </div>
                <label
                  class="composer-mode-toggle"
                  for="yolo-toggle"
                  title="When enabled, all tool calls skip approval"
                  data-i18n-title="composer.yolo_title"
                >
                  <input type="checkbox" id="yolo-toggle" checked />
                  <span class="composer-mode-check" aria-hidden="true"></span>
                  <span class="composer-mode-copy">
                    <span class="composer-mode-title">YOLO</span>
                  </span>
                </label>
                <label
                  class="composer-mode-toggle has-inline-select"
                  for="thinking-mode-toggle"
                  title="When off, backend decides thinking mode; Effort depends on backend support"
                  data-i18n-title="composer.thinking_title"
                >
                  <input type="checkbox" id="thinking-mode-toggle" />
                  <span class="composer-mode-check" aria-hidden="true"></span>
                  <span class="composer-mode-copy">
                    <span
                      class="composer-mode-title"
                      data-i18n="composer.thinking"
                      >Thinking</span
                    >
                    <span
                      class="composer-mode-inline"
                      id="thinking-effort-field"
                      hidden
                    >
                      <span
                        class="composer-mode-inline-label"
                        data-i18n="composer.effort"
                        >Effort</span
                      >
                      <select
                        id="thinking-effort-select"
                        class="composer-mode-inline-select"
                      >
                    <option value="minimal" data-i18n="composer.effort.minimal">最少</option>
                    <option value="low" data-i18n="composer.effort.low">低</option>
                    <option value="medium" selected data-i18n="composer.effort.medium">中</option>
                    <option value="high" data-i18n="composer.effort.high">高</option>
                      </select>
                    </span>
                  </span>
                </label>
                <div class="composer-usage-strip">
                  <div
                    id="main-context-indicator"
                    class="context-indicator composer-context-indicator composer-usage-pill"
                    data-state="idle"
                    title="Prompt / context window"
                    data-i18n-title="context_indicator.latest_title"
                  >
                    -- / --
                  </div>
                  <div
                    id="session-token-usage"
                    class="session-token-usage composer-usage-pill"
                    title="Session token usage"
                    data-i18n-title="composer.tokens_title"
                    data-i18n="composer.tokens"
                  >
                    ↑ -- ↓ --
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="/v1/vendor/chart.js" defer></script>
    <script src="/v1/js/vendor/marked.min.js" defer></script>
    <script src="/v1/js/vendor/highlight.min.js" defer></script>
    <script type="module" src="/v1/js/app.js"></script>
  </body>
</html>
