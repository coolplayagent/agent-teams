[package]
name = "relay-teams-performance-iteration"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Independent high-concurrency performance self-iteration harness for relay-teams."
license = "MIT"
publish = false

[[bin]]
name = "relay-teams-performance-iterate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time", "sync", "process", "io-util", "net"] }

[lints.rust]
unsafe_code = "forbid"
